services:
  - type: web
    name: cognivault-backend
    runtime: python
    plan: free
    buildCommand: pip install -U pip && pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: MODEL_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_PROVIDER
        value: hashing
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://cogni-vault.vercel.app,https://cogni-vault-git-main-code-ksethram.vercel.app
      # Also accepts every Vercel address of this project (production, branch alias, per-deploy URL).
      - key: CORS_ORIGIN_REGEX
        value: ^https://cogni-vault(-[a-z0-9-]+)?\.vercel\.app$
      - key: CV_DATA_DIR
        value: /tmp/cognivault
