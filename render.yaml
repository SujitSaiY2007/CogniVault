services:
  - type: web
    name: cognivault-backend
    runtime: python
    plan: free
    buildCommand: "pip install -U pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.agent_os.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: APP_ENV
        value: production
      - key: MODEL_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        value: ""
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CHROMA_PERSIST_DIR
        value: data/chroma
