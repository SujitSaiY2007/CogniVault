[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognivault"
version = "2.0.0"
description = "Evidence-first study companion: cited tutoring, verified practice and an adaptive learner model over your own course material"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10",
  "pymupdf>=1.24",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0"]
local-embeddings = ["sentence-transformers>=3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning"]
