[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognivault"
version = "0.1.0"
description = "Evidence-first adaptive learning foundation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pymupdf>=1.24,<2",
  "python-pptx>=0.6.23,<1",
  "numpy>=1.26,<3",
  "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
